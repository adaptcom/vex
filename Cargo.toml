
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "UNLICENSED"
repository = "https://github.com/scsmithr/vex"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = true

[workspace.lints.clippy]
literal_string_with_formatting_args = "warn"

[workspace.dependencies]
vex_core = { path = "crates/vex_core" }
